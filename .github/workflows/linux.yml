name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_TAG: tdesktop:centos_env

jobs:

  linux:
    name: Build (centos_env, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check API credentials.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Set repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH."
            echo "Get your own API id/hash at https://my.telegram.org (API development tools), then run:"
            echo "  gh secret set TDESKTOP_API_ID --repo $GITHUB_REPOSITORY"
            echo "  gh secret set TDESKTOP_API_HASH --repo $GITHUB_REPOSITORY"
            exit 1
          fi

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.os }}-libs-

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        id: move-cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save libraries cache.
        if: >
          always()
            && steps.cache-libs.outputs.cache-hit != 'true'
            && steps.move-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Compiler cache.
        id: cache-tdesktop
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-tdesktop-release-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-tdesktop-release-

      - name: Build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v $CCACHE_DIR:/var/cache/ccache \
          -e CONFIG=Release \
          -e KEEP_GOING=1 \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=$API_ID \
          -D TDESKTOP_API_HASH=$API_HASH \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Count ccache misses.
        id: ccache-stats
        if: always()
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Save compiler cache.
        if: >
          always()
            && steps.cache-tdesktop.outputs.cache-hit != 'true'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        run: |
          filePath="out/Release/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"
            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: exteraDesktop-linux
          path: out/Release/Telegram
          if-no-files-found: error
          retention-days: 14
