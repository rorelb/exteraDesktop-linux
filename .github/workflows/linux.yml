name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_TAG: tdesktop:centos_env

jobs:

  linux:
    name: Build (centos_env, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check API credentials.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Set repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH."
            echo "Get your own API id/hash at https://my.telegram.org (API development tools), then run:"
            echo "  gh secret set TDESKTOP_API_ID --repo $GITHUB_REPOSITORY"
            echo "  gh secret set TDESKTOP_API_HASH --repo $GITHUB_REPOSITORY"
            exit 1
          fi

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.os }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Compiler cache.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-tdesktop-release-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-tdesktop-release-

      - name: Build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ runner.temp }}/.tdesktop-cache:/var/cache/ccache \
          -e CONFIG=Release \
          -e KEEP_GOING=1 \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=$API_ID \
          -D TDESKTOP_API_HASH=$API_HASH \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Check.
        run: |
          filePath="out/Release/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"
            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: exteraDesktop-linux
          path: out/Release/Telegram
          if-no-files-found: error
          retention-days: 14
